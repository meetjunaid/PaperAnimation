# Attaches an upload-ready ZIP of the skill to every published release, so the
# README's download button always serves the current version.
name: Release skill ZIP

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the ZIP (skill folder at the root, as Claude.ai and ChatGPT expect)
        run: |
          cd skills
          zip -r -X ../paper-animation.zip paper-animation -x '*/__pycache__/*' '*.DS_Store'
      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" paper-animation.zip --clobber

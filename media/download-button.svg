<svg xmlns="http://www.w3.org/2000/svg" width="590" height="150" viewBox="0 0 590 150" role="img" aria-label="Download the skill: free ZIP for Claude and ChatGPT">
  <title>Download the skill</title>
  <style>
    .label { font: 800 36px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1d1b18; }
    .sub { font: 600 17px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #4a4337; letter-spacing: .02em; }
    .arrow { animation: bob 1.6s ease-in-out infinite; }
    .shine { animation: sweep 3.2s ease-in-out infinite; }
    .ring { animation: pulse 2.4s ease-out infinite; transform-origin: 295px 70px; }
    @keyframes bob { 0%, 100% { transform: translateY(-3px); } 50% { transform: translateY(5px); } }
    @keyframes sweep { 0% { transform: translateX(-260px); } 55%, 100% { transform: translateX(700px); } }
    @keyframes pulse { 0% { opacity: .55; transform: scale(1); } 70%, 100% { opacity: 0; transform: scale(1.06, 1.22); } }
    @media (prefers-reduced-motion: reduce) { .arrow, .shine, .ring { animation: none; } .ring { opacity: 0; } }
  </style>
  <defs>
    <clipPath id="btn"><rect x="10" y="10" width="560" height="120" rx="22"/></clipPath>
    <linearGradient id="gloss" x1="0" x2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".6"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- attention ring -->
  <rect class="ring" x="10" y="10" width="560" height="120" rx="22" fill="none" stroke="#f5d547" stroke-width="4"/>
  <!-- printed drop shadow, then the button -->
  <rect x="17" y="17" width="560" height="120" rx="22" fill="#1d1b18"/>
  <rect x="10" y="10" width="560" height="120" rx="22" fill="#f5d547" stroke="#1d1b18" stroke-width="3"/>
  <g clip-path="url(#btn)">
    <g class="shine"><rect x="0" y="0" width="110" height="150" fill="url(#gloss)" transform="skewX(-20)"/></g>
  </g>
  <!-- download icon -->
  <circle cx="82" cy="70" r="40" fill="#1d1b18"/>
  <g class="arrow" fill="none" stroke="#f5d547" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M82 46 V82"/>
    <path d="M67 68 L82 83 L97 68"/>
  </g>
  <path d="M64 93 H100" stroke="#f5d547" stroke-width="7" stroke-linecap="round"/>
  <!-- text -->
  <text class="label" x="146" y="70">Download the skill</text>
  <text class="sub" x="148" y="102">FREE · 3 MB ZIP · FOR CLAUDE &amp; CHATGPT</text>
</svg>
